# Render Blueprint for LearnFlow (backend + RAG service).
#
# How to use:
#   1. Push this file to GitHub.
#   2. In the Render dashboard: New -> Blueprint, select the LearnFlow repo.
#   3. Fill in the env vars marked `sync: false` (MONGO_URI, JWT_SECRET,
#      ADMIN_KEY, GROQ_API_KEY, FRONTEND_URL, AI_SERVICE_URL, ALLOWED_ORIGINS).
#   4. Every push to `main` auto-deploys, and the GitHub `CD` workflow can
#      trigger deploys via the Render deploy hooks.
#
# Frontend is deployed separately to Vercel (see .github/workflows/deploy.yml).
# Vercel needs one env var: VITE_API_URL=https://learnflow-backend.onrender.com/api/v1

services:
  # ---------------- Backend (Node.js / Express) ----------------
  - type: web
    name: learnflow-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: node src/app.js
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        sync: false # long random string used to sign JWTs
      - key: ADMIN_KEY
        sync: false # optional: register with this key to create an admin account
      - key: FRONTEND_URL
        value: https://learnflow.vercel.app,https://learnflow-git-main-rutik-kanzariya.vercel.app,http://localhost:5173
      - key: AI_SERVICE_URL
        value: https://learnflow-rag.onrender.com # RAG service internal/external URL
      - key: ALLOWED_ORIGINS
        value: https://learnflow.vercel.app,https://learnflow-git-main-rutik-kanzariya.vercel.app,http://localhost:5173

  # ---------------- RAG Service (Python / FastAPI) ----------------
  - type: web
    name: learnflow-rag
    runtime: python
    rootDir: RAG
    plan: free
    buildCommand: pip install -r render-requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # NOTE: Free-tier Render does not support disks. Uploaded vector data is
    # stored in the ephemeral filesystem and is reset on redeploy (re-upload
    # documents to rebuild it). On a paid plan, add a disk here and point
    # CHROMA_DB_DIR at its mount path, e.g.:
    # disk:
    #   name: chroma-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: GROQ_API_KEY
        sync: false # Groq API key (https://console.groq.com) - same key + format as OpenAI
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: EMBEDDING_PROVIDER
        value: local # "local" = sentence-transformers, no extra API key needed
      - key: CHROMA_DB_DIR
        value: chroma-db # local dir on free tier; use disk mount path on paid plans
      - key: ALLOWED_ORIGINS
        value: https://learnflow.vercel.app,https://learnflow-git-main-rutik-kanzariya.vercel.app,http://localhost:5173
      - key: OMP_NUM_THREADS
        value: "1" # keep memory low on the free tier
      - key: TOKENIZERS_PARALLELISM
        value: "false"